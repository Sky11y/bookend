[package]
name = "backend-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "time"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = "1.26.1"
