[package]
name = "bookend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "migrate", "time"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
